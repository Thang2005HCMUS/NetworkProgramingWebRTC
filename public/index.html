<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RoomChat Production Mesh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}
#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.panel{
    width:100%;
    max-width:420px;
    background:#1d1d1d;
    padding:24px;
    border-radius:14px;
}
.panel h2{
    text-align:center;
    margin-bottom:14px;
}
input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
}
button{
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
}
.primary{
    width:100%;
    background:#0d6efd;
    color:#fff;
}
#app{
    display:none;
    padding:12px;
}
.topbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
}
.topbar button{
    flex:1;
    min-width:120px;
}
.call{background:#198754;color:#fff}
.end{background:#ff9800;color:#fff}
.leave{background:#dc3545;color:#fff}
.hidden{display:none !important}
#members{
    background:#1c1c1c;
    padding:10px;
    border-radius:12px;
    margin-bottom:12px;
}
/* VM */
#notices{
    position:fixed;
    right:16px;
    bottom:16px;
    width:280px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:999;
}
.notice{
    background:#1f2937;
    border:1px solid #374151;
    padding:10px 12px;
    border-radius:10px;
    font-size:0.9rem;
    color:#f1f5f9;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    animation:toastIn 180ms ease-out;
}
@keyframes toastIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
}
#members h3{
    margin-bottom:8px;
}
.member{
    padding:6px 0;
    border-bottom:1px solid #333;
}
.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}
@media(max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
    .grid{grid-template-columns:1fr;}
}
.card{
    background:#1d1d1d;
    border-radius:12px;
    padding:10px;
    height:260px;
}
video{
    width:100%;
    height:190px;
    object-fit:cover;
    border-radius:8px;
    background:#000;
}
.name{
    margin-top:8px;
    text-align:center;
}
</style>
</head>

<body>

<div id="login">
    <div class="panel">
        <h2>RoomChat Mesh</h2>
        <input id="nameInput" placeholder="Tên">
        <input id="roomInput" placeholder="ID phòng">
        <button class="primary" onclick="joinRoom()">Vào phòng</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <button class="call" onclick="callRoom()">Call phòng</button>
        <button id="btn-end-call" class="end" onclick="endCall()">End Call</button>
        <button class="leave" onclick="leaveRoom()">Rời phòng</button>
    </div>

    <div id="members">
        <h3 id="roomTitle"></h3>
        <div id="memberBox"></div>
    </div>
    <!-- VM -->
    <div id="notices"></div>

    <div class="grid" id="grid"></div>
</div>

<script>
const ws = new WebSocket(`wss://${location.host}`);

let myName = "";
let roomId = "";
let members = [];
let localStream = null;
let inCall = false;
let roomOwner = "";

const endCallBtn = document.getElementById("btn-end-call");

/*
peerState[target] = {
   pc,
   makingOffer,
   ignoreOffer,
   polite,
   remoteStream
}
*/
const peerState = {};

// VM
function addNotice(message){
    const box = document.getElementById("notices");
    if(!box) return;

    const div = document.createElement("div");
    div.className = "notice";
    div.innerText = message;
    box.prepend(div);

    setTimeout(()=>{
        div.remove();
    }, 6000);
}

const rtcConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { 
            urls: 'turn:54.146.22.145:3478', 
            username: 'thang', 
            credential: '051317' 
        }
    ]
};

/* =========================
   WS
========================= */

ws.onmessage = async(e)=>{
    const data = JSON.parse(e.data);

    switch(data.type){

        case "roomMembers":
            members = data.members;
            if(!roomOwner || !members.includes(roomOwner)){
                roomOwner = members[0] || "";
            }
            updateEndCallVisibility();
            renderMembers();
            renderGrid();

            if(inCall){
                ensureMesh();
            }
        break;
        case "error":
            alert("Lỗi từ hệ thống: " + data.message);
            document.getElementById("login").style.display = "flex";
            document.getElementById("app").style.display = "none";
            if(localStream){
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
        break;
        case "startCall":
            if(!inCall) {
                inCall = true;
                ensureMesh();
            }
        break;
        case "offer":
            await onOffer(data);
        break;

        case "answer":
            await onAnswer(data);
        break;

        case "candidate":
            await onCandidate(data);
        break;

        case "memberLeft": 
            addNotice(data.name + " đã rời phòng."); //VM
            removePeer(data.name);
            members = members.filter(x=>x!==data.name);
            renderMembers();
            renderGrid();
        break;

        case "endCall":
            inCall = false;
            endAllPeers();
            addNotice(data.sender + " đã kết thúc cuộc gọi.");
            console.log(`Người dùng ${data.sender} đã kết thúc cuộc gọi.`);
            const statusEl = document.getElementById("status_" + data.sender);
            if (statusEl) {
                statusEl.innerText = "Status: End Call";
                statusEl.style.color = "#ffc107";
             }
            setTimeout(() => {
            removePeer(data.sender);
            renderGrid(); 
            }, 2000);
        break;
    }
};

/* =========================
   JOIN
========================= */

async function joinRoom(){

    myName = document.getElementById("nameInput").value.trim();
    roomId = document.getElementById("roomInput").value.trim();

    if(!myName || !roomId) return;

    localStream = await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
    });

    ws.send(JSON.stringify({
        type:"register",
        name:myName
    }));

    ws.send(JSON.stringify({
        type:"joinRoom",
        roomId,
        name:myName
    }));

    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("roomTitle").innerText = "Phòng: " + roomId;
}

/* =========================
   UI
========================= */

function renderMembers(){
    const box = document.getElementById("memberBox");
    box.innerHTML = "";

    members.forEach(name=>{
        const div = document.createElement("div");
        div.className="member";
        div.innerText=name;
        box.appendChild(div);
    });
}

function renderGrid(){

    const grid = document.getElementById("grid");
    grid.innerHTML="";

    members.forEach(name=>{

        const card = document.createElement("div");
        card.className="card";
        
        if (name !== myName) {
            const statusLabel = document.createElement("div");
            statusLabel.className = "status-label";
            statusLabel.id = "status_" + name;
            
            const currentState = peerState[name]?.pc?.connectionState || "new";
            statusLabel.innerText = "Status: " + currentState;
            statusLabel.style.fontSize = "12px";
            statusLabel.style.color = (currentState === "connected") ? "#198754" : "#aaa";
            card.appendChild(statusLabel);
        }

        const video = document.createElement("video");
        video.autoplay=true;
        video.playsInline=true;
        video.id="video_"+name;

        if(name===myName && localStream){
            video.muted=true;
            video.srcObject=localStream;
        } else if(peerState[name] && peerState[name].remoteStream){
            video.srcObject = peerState[name].remoteStream;
        }

        const label = document.createElement("div");
        label.className="name";
        label.innerText=name;

        card.appendChild(video);
        card.appendChild(label);
        grid.appendChild(card);
    });
}

/* =========================
   CALL CONTROL
========================= */

function callRoom(){
    inCall = true;
    // Gửi tín hiệu để kích hoạt Mesh trên toàn bộ client trong phòng
    ws.send(JSON.stringify({
        type: "startCall",
        roomId,
        sender: myName
    }));
    ensureMesh();
}

function endCall(){

    if(roomOwner && myName !== roomOwner) return;

    inCall = false;

    endAllPeers();

    ws.send(JSON.stringify({
        type:"endCall",
        roomId,
        sender:myName
    }));
}

function endAllPeers(){
    Object.keys(peerState).forEach(name=>{
        removePeer(name);
    });
}

function updateEndCallVisibility(){
    if(!endCallBtn) return;
    if(roomOwner && myName === roomOwner){
        endCallBtn.classList.remove("hidden");
    } else {
        endCallBtn.classList.add("hidden");
    }
}

function ensureMesh(){

    for(const user of members){

        if(user === myName) continue;

        if(!peerState[user]){
            createPeer(user);
        }
    }
}

/* =========================
   PEER
========================= */

function createPeer(target){

    const polite = myName.localeCompare(target) > 0;

    const pc = new RTCPeerConnection(rtcConfig);
    const timeoutId = setTimeout(() => {
        const statusEl = document.getElementById("status_" + target);
        if (pc.connectionState !== "connected") {
            if (statusEl) {
                statusEl.innerText = "Startus: P2P failed, trying TURN....";
                statusEl.style.color = "#ff9800";
            }
            console.warn(`[Fallback] ${target} chậm kết nối, đang ưu tiên relay qua TURN.`);
        }
    }, 15000);

    const state = {
        pc,
        makingOffer:false,
        ignoreOffer:false,
        polite,
        timeoutId: timeoutId
    };

    peerState[target]=state;
    
    localStream.getTracks().forEach(track=>{
        pc.addTrack(track, localStream);
    });

    pc.ontrack = (event)=>{
        const video = document.getElementById("video_"+target);
        state.remoteStream = event.streams[0];
        if(video){
            video.srcObject = state.remoteStream;
        }
    };

    pc.onicecandidate = ({candidate})=>{
        if(candidate){
            ws.send(JSON.stringify({
                type:"candidate",
                roomId,
                sender:myName,
                target,
                candidate
            }));
        }
    };

    pc.onnegotiationneeded = async()=>{

        try{
            state.makingOffer = true;

            await pc.setLocalDescription(
                await pc.createOffer()
            );

            ws.send(JSON.stringify({
                type:"offer",
                roomId,
                sender:myName,
                target,
                offer:pc.localDescription
            }));

        }catch(err){
            console.log(err);
        }finally{
            state.makingOffer = false;
        }
    };

    pc.onconnectionstatechange = ()=>{
        const statusEl = document.getElementById("status_" + target);
        const state = pc.connectionState;
        
        if (statusEl) {
            statusEl.innerText = "Status: " + state;
            
            if (state === "connected") {
                statusEl.style.color = "#198754";
                clearTimeout(timeoutId);
            } else if (state === "failed") {
                statusEl.style.color = "#dc3545";
                clearTimeout(timeoutId);
            } else if (state === "connecting") {
                statusEl.style.color = "#0dcaf0";
            } else if (state === "disconnected") {
                statusEl.style.color = "#ffc107"
            }
        }
        if(
            pc.connectionState === "failed" ||
            pc.connectionState === "closed" ||
            pc.connectionState === "disconnected"
        ){
            setTimeout(() => {
                if (peerState[target]) removePeer(target);
            }, 3000);
        }
    };

    return state;
}

/* =========================
   SIGNALING
========================= */

async function onOffer(data){

    let state = peerState[data.sender];

    if(!state){
        state = createPeer(data.sender);
    }

    const pc = state.pc;

    const offerCollision =
        data.offer.type === "offer" &&
        (state.makingOffer || pc.signalingState !== "stable");

    state.ignoreOffer = !state.polite && offerCollision;

    if(state.ignoreOffer) return;

    try{

        await pc.setRemoteDescription(data.offer);

        await pc.setLocalDescription(
            await pc.createAnswer()
        );

        ws.send(JSON.stringify({
            type:"answer",
            roomId,
            sender:myName,
            target:data.sender,
            answer:pc.localDescription
        }));

    }catch(err){
        console.log(err);
    }
}

async function onAnswer(data){

    const state = peerState[data.sender];
    if(!state) return;

    try{
        await state.pc.setRemoteDescription(data.answer);
    }catch(err){
        console.log(err);
    }
}

async function onCandidate(data){

    const state = peerState[data.sender];
    if(!state) return;

    try{
        await state.pc.addIceCandidate(data.candidate);
    }catch(err){

        if(!state.ignoreOffer){
            console.log(err);
        }
    }
}

/* =========================
   REMOVE
========================= */

function removePeer(name){

    const state = peerState[name];
    if(!state) return;

    state.pc.close();
    state.remoteStream = null;
    delete peerState[name];

    const video = document.getElementById("video_"+name);
    if(video && name !== myName){
        video.srcObject = null;
    }
}

/* =========================
   LEAVE
========================= */

function leaveRoom(){

    endCall();

    ws.send(JSON.stringify({
        type:"leaveRoom",
        roomId,
        sender:myName
    }));

    if(localStream){
        localStream.getTracks().forEach(t=>t.stop());
    }

    location.reload();
}
</script>

</body>
</html>
